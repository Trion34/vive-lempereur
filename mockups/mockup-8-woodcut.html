<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mockup 8: Woodcut Etching</title>
<style>
  body { margin: 0; background: #0a0908; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .frame { width: 800px; height: 500px; position: relative; border-radius: 4px; overflow: hidden; }
  svg { width: 100%; height: 100%; }
  .info { position: absolute; top: 8px; left: 12px; font-family: monospace; font-size: 10px; color: rgba(200,185,154,0.4); letter-spacing: 1px; }
</style>
</head>
<body>
<div class="frame">
  <div class="info">MOCKUP 8 — WOODCUT: Period illustration style. Bold outlines, crosshatching, engraved feel.</div>
  <svg viewBox="0 0 800 500">
    <defs>
      <!-- Aged paper background -->
      <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1a1610"/>
        <stop offset="50%" stop-color="#1e1a14"/>
        <stop offset="100%" stop-color="#181410"/>
      </linearGradient>
      <!-- Edge vignette -->
      <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.65">
        <stop offset="0%" stop-color="transparent"/>
        <stop offset="100%" stop-color="rgba(5,4,3,0.7)"/>
      </radialGradient>
      <!-- Crosshatch pattern -->
      <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="4" stroke="rgba(139,122,94,0.06)" stroke-width="0.5"/>
      </pattern>
      <pattern id="hatch-dense" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="3" stroke="rgba(139,122,94,0.08)" stroke-width="0.5"/>
      </pattern>
      <!-- Crosshatch for ground -->
      <pattern id="ground-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(80,65,40,0.06)" stroke-width="0.5"/>
      </pattern>
      <pattern id="ground-hatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(80,65,40,0.05)" stroke-width="0.5"/>
      </pattern>
    </defs>

    <!-- Paper background -->
    <rect width="800" height="500" fill="url(#paper)"/>
    <rect width="800" height="500" fill="url(#hatch)"/>

    <!-- Horizon line (bold, engraved) -->
    <line x1="0" y1="220" x2="800" y2="220" stroke="rgba(139,122,94,0.15)" stroke-width="1.5"/>

    <!-- Ground hatching -->
    <rect x="0" y="220" width="800" height="280" fill="url(#ground-hatch)"/>
    <rect x="0" y="220" width="800" height="280" fill="url(#ground-hatch2)"/>

    <!-- Distant hills (simple engraved lines) -->
    <path d="M 0 220 Q 100 200 200 215 Q 300 205 400 218 Q 500 208 600 215 Q 700 200 800 220" fill="none" stroke="rgba(139,122,94,0.12)" stroke-width="1.5"/>
    <path d="M 0 216 Q 150 195 300 210 Q 450 195 600 210 Q 700 200 800 215" fill="none" stroke="rgba(139,122,94,0.07)" stroke-width="1"/>

    <!-- === AUSTRIAN COLUMN (bold woodcut outline) === -->
    <g transform="translate(330, 230)">
      <!-- Main formation block — thick outlined rectangle -->
      <rect x="0" y="0" width="130" height="80" rx="2" fill="url(#hatch-dense)" stroke="rgba(139,122,94,0.5)" stroke-width="2"/>

      <!-- Internal rank lines (engraved) -->
      <line x1="5" y1="16" x2="125" y2="16" stroke="rgba(139,122,94,0.2)" stroke-width="0.8"/>
      <line x1="5" y1="32" x2="125" y2="32" stroke="rgba(139,122,94,0.2)" stroke-width="0.8"/>
      <line x1="5" y1="48" x2="125" y2="48" stroke="rgba(139,122,94,0.15)" stroke-width="0.6"/>
      <line x1="5" y1="64" x2="125" y2="64" stroke="rgba(139,122,94,0.1)" stroke-width="0.5"/>

      <!-- Front rank detail — bayonet tips protruding -->
      <line x1="15" y1="0" x2="15" y2="-8" stroke="rgba(139,122,94,0.35)" stroke-width="1"/>
      <line x1="35" y1="0" x2="35" y2="-10" stroke="rgba(139,122,94,0.35)" stroke-width="1"/>
      <line x1="55" y1="0" x2="55" y2="-8" stroke="rgba(139,122,94,0.35)" stroke-width="1"/>
      <line x1="75" y1="0" x2="75" y2="-9" stroke="rgba(139,122,94,0.35)" stroke-width="1"/>
      <line x1="95" y1="0" x2="95" y2="-8" stroke="rgba(139,122,94,0.35)" stroke-width="1"/>
      <line x1="115" y1="0" x2="115" y2="-10" stroke="rgba(139,122,94,0.35)" stroke-width="1"/>

      <!-- Regimental flag -->
      <line x1="65" y1="-12" x2="65" y2="-30" stroke="rgba(139,122,94,0.4)" stroke-width="1.5"/>
      <rect x="66" y="-30" width="14" height="10" rx="1" fill="rgba(200,185,154,0.15)" stroke="rgba(139,122,94,0.3)" stroke-width="0.8"/>

      <!-- Label (italic, period-style annotation) -->
      <text x="65" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="rgba(139,122,94,0.5)">Austrian Column</text>
    </g>

    <!-- Range — map annotation style -->
    <g transform="translate(310, 330)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="rgba(139,122,94,0.3)" stroke-width="1"/>
      <line x1="150" y1="0" x2="180" y2="0" stroke="rgba(139,122,94,0.3)" stroke-width="1"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="rgba(139,122,94,0.3)" stroke-width="1"/>
      <line x1="180" y1="-4" x2="180" y2="4" stroke="rgba(139,122,94,0.3)" stroke-width="1"/>
      <text x="90" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="rgba(139,122,94,0.45)">80 paces</text>
    </g>

    <!-- === FRENCH LINE (bold woodcut, hybrid detail) === -->
    <g transform="translate(40, 365)">
      <!-- Full line outline (thick engraved border) -->
      <rect x="0" y="0" width="720" height="20" rx="1" fill="none" stroke="rgba(58,80,120,0.35)" stroke-width="2"/>

      <!-- Left wing — simple hatched blocks -->
      <g>
        <rect x="4" y="3" width="60" height="14" rx="1" fill="url(#hatch-dense)" stroke="rgba(58,80,120,0.2)" stroke-width="0.5" opacity="0.5"/>
        <rect x="70" y="3" width="60" height="14" rx="1" fill="url(#hatch-dense)" stroke="rgba(58,80,120,0.2)" stroke-width="0.5" opacity="0.6"/>
        <rect x="136" y="3" width="60" height="14" rx="1" fill="url(#hatch-dense)" stroke="rgba(58,80,120,0.2)" stroke-width="0.5" opacity="0.7"/>
        <rect x="202" y="3" width="60" height="14" rx="1" fill="url(#hatch-dense)" stroke="rgba(58,80,120,0.2)" stroke-width="0.5" opacity="0.8"/>
      </g>

      <!-- PLAYER ZONE (detailed, individual figures as bold outlines) -->
      <g transform="translate(270, -50)">
        <!-- Zone bracket -->
        <rect x="-4" y="48" width="180" height="28" rx="2" fill="none" stroke="rgba(139,122,94,0.25)" stroke-width="1.5"/>

        <!-- Pierre — standing figure outline -->
        <g transform="translate(10, 0)">
          <ellipse cx="12" cy="8" rx="6" ry="5" fill="none" stroke="rgba(58,80,120,0.5)" stroke-width="1.5"/>
          <rect x="4" y="12" width="16" height="20" rx="1" fill="none" stroke="rgba(58,80,120,0.5)" stroke-width="1.5"/>
          <line x1="7" y1="32" x2="5" y2="50" stroke="rgba(58,80,120,0.4)" stroke-width="1.5"/>
          <line x1="17" y1="32" x2="19" y2="50" stroke="rgba(58,80,120,0.4)" stroke-width="1.5"/>
          <!-- Musket (diagonal line) -->
          <line x1="20" y1="14" x2="26" y2="50" stroke="rgba(80,65,40,0.4)" stroke-width="1.5"/>
          <line x1="20" y1="14" x2="19" y2="6" stroke="rgba(139,122,94,0.3)" stroke-width="1"/>
          <text x="12" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-style="italic" fill="rgba(139,122,94,0.4)">P.</text>
        </g>

        <!-- YOU — bolder outline, thicker strokes -->
        <g transform="translate(60, 0)">
          <!-- Shako outline -->
          <rect x="4" y="-2" width="16" height="8" rx="1" fill="none" stroke="rgba(58,80,120,0.7)" stroke-width="2"/>
          <!-- Head -->
          <ellipse cx="12" cy="10" rx="7" ry="6" fill="none" stroke="rgba(139,122,94,0.6)" stroke-width="2"/>
          <!-- Body -->
          <rect x="2" y="15" width="20" height="22" rx="1" fill="none" stroke="rgba(58,80,120,0.7)" stroke-width="2"/>
          <!-- Cross belts -->
          <line x1="4" y1="16" x2="20" y2="34" stroke="rgba(139,122,94,0.4)" stroke-width="1.2"/>
          <line x1="20" y1="16" x2="4" y2="34" stroke="rgba(139,122,94,0.4)" stroke-width="1.2"/>
          <!-- Legs -->
          <line x1="7" y1="37" x2="5" y2="52" stroke="rgba(58,80,120,0.6)" stroke-width="2"/>
          <line x1="17" y1="37" x2="19" y2="52" stroke="rgba(58,80,120,0.6)" stroke-width="2"/>
          <!-- Musket -->
          <line x1="22" y1="16" x2="28" y2="52" stroke="rgba(80,65,40,0.5)" stroke-width="2"/>
          <line x1="22" y1="16" x2="21" y2="6" stroke="rgba(139,122,94,0.4)" stroke-width="1.2"/>
          <!-- Name (ornate) -->
          <text x="12" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-weight="bold" font-style="italic" fill="rgba(139,122,94,0.6)">You</text>
        </g>

        <!-- JB -->
        <g transform="translate(120, 0)">
          <ellipse cx="12" cy="8" rx="6" ry="5" fill="none" stroke="rgba(58,80,120,0.5)" stroke-width="1.5"/>
          <rect x="4" y="12" width="16" height="20" rx="1" fill="none" stroke="rgba(58,80,120,0.5)" stroke-width="1.5"/>
          <line x1="7" y1="32" x2="5" y2="50" stroke="rgba(58,80,120,0.4)" stroke-width="1.5"/>
          <line x1="17" y1="32" x2="19" y2="50" stroke="rgba(58,80,120,0.4)" stroke-width="1.5"/>
          <line x1="20" y1="14" x2="26" y2="50" stroke="rgba(80,65,40,0.4)" stroke-width="1.5"/>
          <line x1="20" y1="14" x2="19" y2="6" stroke="rgba(139,122,94,0.3)" stroke-width="1"/>
          <text x="12" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-style="italic" fill="rgba(139,122,94,0.4)">J-B.</text>
        </g>
      </g>

      <!-- Right wing — simple hatched blocks -->
      <g>
        <rect x="460" y="3" width="60" height="14" rx="1" fill="url(#hatch-dense)" stroke="rgba(58,80,120,0.2)" stroke-width="0.5" opacity="0.8"/>
        <rect x="526" y="3" width="60" height="14" rx="1" fill="url(#hatch-dense)" stroke="rgba(58,80,120,0.2)" stroke-width="0.5" opacity="0.7"/>
        <rect x="592" y="3" width="60" height="14" rx="1" fill="url(#hatch-dense)" stroke="rgba(58,80,120,0.2)" stroke-width="0.5" opacity="0.6"/>
        <rect x="656" y="3" width="60" height="14" rx="1" fill="url(#hatch-dense)" stroke="rgba(58,80,120,0.2)" stroke-width="0.5" opacity="0.5"/>
      </g>

      <!-- Bayonet tips above French line -->
      <g stroke="rgba(58,80,120,0.2)" stroke-width="0.8">
        <line x1="20" y1="0" x2="20" y2="-5"/><line x1="50" y1="0" x2="50" y2="-6"/>
        <line x1="90" y1="0" x2="90" y2="-5"/><line x1="120" y1="0" x2="120" y2="-7"/>
        <line x1="160" y1="0" x2="160" y2="-5"/><line x1="190" y1="0" x2="190" y2="-6"/>
        <line x1="500" y1="0" x2="500" y2="-5"/><line x1="540" y1="0" x2="540" y2="-6"/>
        <line x1="580" y1="0" x2="580" y2="-5"/><line x1="620" y1="0" x2="620" y2="-7"/>
        <line x1="660" y1="0" x2="660" y2="-5"/><line x1="700" y1="0" x2="700" y2="-6"/>
      </g>

      <!-- Regiment annotation -->
      <text x="360" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-style="italic" fill="rgba(58,80,120,0.3)">14e Demi-Brigade de Ligne</text>
    </g>

    <!-- Smoke wisps (engraved curl lines) -->
    <path d="M 200 360 Q 220 350 250 355 Q 280 345 310 350" fill="none" stroke="rgba(139,122,94,0.08)" stroke-width="1.5"/>
    <path d="M 450 355 Q 480 345 520 350 Q 550 340 590 348" fill="none" stroke="rgba(139,122,94,0.06)" stroke-width="1.5"/>

    <!-- Vignette -->
    <rect width="800" height="500" fill="url(#vignette)"/>
  </svg>
</div>
</body>
</html>
