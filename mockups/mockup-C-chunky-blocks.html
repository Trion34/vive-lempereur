<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mockup C: Chunky Blocks with Inner Detail</title>
<style>
  body { margin: 0; background: #0a0908; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .frame { width: 800px; height: 500px; border-radius: 4px; overflow: hidden; }
  svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="frame">
  <svg viewBox="0 0 800 500">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0a0908"/>
        <stop offset="100%" stop-color="#141210"/>
      </linearGradient>
      <filter id="player-glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="smoke-blur"><feGaussianBlur stdDeviation="8"/></filter>
    </defs>

    <rect width="800" height="500" fill="url(#bg)"/>

    <!-- Austrian column: 4w x 8d, thick blocks with bayonet line on top -->
    <g transform="translate(332, 35)">
      <!-- Row 1 (front) — bayonets + block -->
      <g>
        <!-- Bayonet tips -->
        <line x1="16" y1="-6" x2="16" y2="0" stroke="rgba(200,190,170,0.3)" stroke-width="1"/>
        <line x1="50" y1="-7" x2="50" y2="0" stroke="rgba(200,190,170,0.3)" stroke-width="1"/>
        <line x1="84" y1="-5" x2="84" y2="0" stroke="rgba(200,190,170,0.3)" stroke-width="1"/>
        <line x1="118" y1="-6" x2="118" y2="0" stroke="rgba(200,190,170,0.3)" stroke-width="1"/>
        <!-- Blocks -->
        <rect x="0" y="0" width="30" height="16" rx="2" fill="rgba(200,185,154,0.35)" stroke="rgba(200,185,154,0.25)" stroke-width="1"/>
        <rect x="34" y="0" width="30" height="16" rx="2" fill="rgba(200,185,154,0.35)" stroke="rgba(200,185,154,0.25)" stroke-width="1"/>
        <rect x="68" y="0" width="30" height="16" rx="2" fill="rgba(200,185,154,0.35)" stroke="rgba(200,185,154,0.25)" stroke-width="1"/>
        <rect x="102" y="0" width="30" height="16" rx="2" fill="rgba(200,185,154,0.35)" stroke="rgba(200,185,154,0.25)" stroke-width="1"/>
        <!-- Inner head dots -->
        <circle cx="8" cy="6" r="2" fill="rgba(180,165,140,0.25)"/><circle cx="16" cy="6" r="2" fill="rgba(180,165,140,0.25)"/><circle cx="24" cy="6" r="2" fill="rgba(180,165,140,0.25)"/>
        <circle cx="42" cy="6" r="2" fill="rgba(180,165,140,0.25)"/><circle cx="50" cy="6" r="2" fill="rgba(180,165,140,0.25)"/><circle cx="58" cy="6" r="2" fill="rgba(180,165,140,0.25)"/>
        <circle cx="76" cy="6" r="2" fill="rgba(180,165,140,0.25)"/><circle cx="84" cy="6" r="2" fill="rgba(180,165,140,0.25)"/><circle cx="92" cy="6" r="2" fill="rgba(180,165,140,0.25)"/>
        <circle cx="110" cy="6" r="2" fill="rgba(180,165,140,0.25)"/><circle cx="118" cy="6" r="2" fill="rgba(180,165,140,0.25)"/><circle cx="126" cy="6" r="2" fill="rgba(180,165,140,0.25)"/>
      </g>
      <!-- Rows 2-4 -->
      <g>
        <rect x="0" y="20" width="30" height="16" rx="2" fill="rgba(200,185,154,0.30)" stroke="rgba(200,185,154,0.2)" stroke-width="0.8"/>
        <rect x="34" y="20" width="30" height="16" rx="2" fill="rgba(200,185,154,0.30)" stroke="rgba(200,185,154,0.2)" stroke-width="0.8"/>
        <rect x="68" y="20" width="30" height="16" rx="2" fill="rgba(200,185,154,0.30)" stroke="rgba(200,185,154,0.2)" stroke-width="0.8"/>
        <rect x="102" y="20" width="30" height="16" rx="2" fill="rgba(200,185,154,0.30)" stroke="rgba(200,185,154,0.2)" stroke-width="0.8"/>
      </g>
      <g>
        <rect x="0" y="40" width="30" height="16" rx="2" fill="rgba(200,185,154,0.24)" stroke="rgba(200,185,154,0.15)" stroke-width="0.6"/>
        <rect x="34" y="40" width="30" height="16" rx="2" fill="rgba(200,185,154,0.24)" stroke="rgba(200,185,154,0.15)" stroke-width="0.6"/>
        <rect x="68" y="40" width="30" height="16" rx="2" fill="rgba(200,185,154,0.24)" stroke="rgba(200,185,154,0.15)" stroke-width="0.6"/>
        <rect x="102" y="40" width="30" height="16" rx="2" fill="rgba(200,185,154,0.24)" stroke="rgba(200,185,154,0.15)" stroke-width="0.6"/>
      </g>
      <g>
        <rect x="0" y="60" width="30" height="16" rx="2" fill="rgba(200,185,154,0.18)" stroke="rgba(200,185,154,0.1)" stroke-width="0.5"/>
        <rect x="34" y="60" width="30" height="16" rx="2" fill="rgba(200,185,154,0.18)" stroke="rgba(200,185,154,0.1)" stroke-width="0.5"/>
        <rect x="68" y="60" width="30" height="16" rx="2" fill="rgba(200,185,154,0.18)" stroke="rgba(200,185,154,0.1)" stroke-width="0.5"/>
        <rect x="102" y="60" width="30" height="16" rx="2" fill="rgba(200,185,154,0.18)" stroke="rgba(200,185,154,0.1)" stroke-width="0.5"/>
      </g>
      <!-- Deep rear (barely visible) -->
      <g opacity="0.5">
        <rect x="0" y="80" width="30" height="16" rx="2" fill="rgba(200,185,154,0.12)"/>
        <rect x="34" y="80" width="30" height="16" rx="2" fill="rgba(200,185,154,0.12)"/>
        <rect x="68" y="80" width="30" height="16" rx="2" fill="rgba(200,185,154,0.12)"/>
        <rect x="102" y="80" width="30" height="16" rx="2" fill="rgba(200,185,154,0.12)"/>
      </g>
      <g opacity="0.3">
        <rect x="0" y="100" width="30" height="16" rx="2" fill="rgba(200,185,154,0.08)"/>
        <rect x="34" y="100" width="30" height="16" rx="2" fill="rgba(200,185,154,0.08)"/>
        <rect x="68" y="100" width="30" height="16" rx="2" fill="rgba(200,185,154,0.08)"/>
        <rect x="102" y="100" width="30" height="16" rx="2" fill="rgba(200,185,154,0.08)"/>
      </g>

      <!-- Regimental color -->
      <line x1="66" y1="-10" x2="66" y2="0" stroke="rgba(200,185,154,0.25)" stroke-width="1.5"/>
      <rect x="67" y="-16" width="10" height="7" rx="1" fill="rgba(200,185,154,0.12)" stroke="rgba(200,185,154,0.2)" stroke-width="0.5"/>

      <text x="66" y="-22" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(200,185,154,0.25)" letter-spacing="1.5">AUSTRIAN COL.</text>
    </g>

    <!-- Range -->
    <text x="400" y="230" text-anchor="middle" fill="rgba(200,185,154,0.35)" font-family="'Courier New', monospace" font-size="28" font-weight="600" letter-spacing="3">80</text>
    <text x="400" y="246" text-anchor="middle" fill="rgba(200,185,154,0.18)" font-family="monospace" font-size="8" letter-spacing="4">PACES</text>

    <!-- Smoke -->
    <ellipse cx="400" cy="330" rx="300" ry="15" fill="rgba(120,110,90,0.04)" filter="url(#smoke-blur)"/>

    <!-- French line: chunky blocks with inner head-dots, bayonet line -->
    <g transform="translate(30, 350)">
      <!-- Bayonet line (continuous, with gaps) -->
      <g stroke="rgba(58,90,139,0.15)" stroke-width="0.8">
        <line x1="8" y1="-5" x2="8" y2="0"/><line x1="24" y1="-6" x2="24" y2="0"/><line x1="44" y1="-5" x2="44" y2="0"/>
        <line x1="60" y1="-6" x2="60" y2="0"/><line x1="80" y1="-5" x2="80" y2="0"/><line x1="96" y1="-6" x2="96" y2="0"/>
        <line x1="116" y1="-5" x2="116" y2="0"/><line x1="152" y1="-6" x2="152" y2="0"/>
        <line x1="188" y1="-5" x2="188" y2="0"/><line x1="224" y1="-6" x2="224" y2="0"/>
        <line x1="260" y1="-5" x2="260" y2="0"/>
      </g>

      <!-- Left wing blocks -->
      <rect x="0" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.25)" stroke="rgba(58,90,139,0.18)" stroke-width="0.6" opacity="0.5"/>
      <rect x="38" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.28)" stroke="rgba(58,90,139,0.2)" stroke-width="0.6" opacity="0.55"/>
      <rect x="76" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.30)" stroke="rgba(58,90,139,0.22)" stroke-width="0.7" opacity="0.6"/>
      <rect x="114" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.33)" stroke="rgba(58,90,139,0.24)" stroke-width="0.7" opacity="0.65"/>
      <rect x="152" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.35)" stroke="rgba(58,90,139,0.26)" stroke-width="0.7" opacity="0.7"/>
      <rect x="190" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.38)" stroke="rgba(58,90,139,0.28)" stroke-width="0.8" opacity="0.75"/>
      <rect x="228" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.40)" stroke="rgba(58,90,139,0.3)" stroke-width="0.8" opacity="0.8"/>
      <rect x="266" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.42)" stroke="rgba(58,90,139,0.32)" stroke-width="0.8" opacity="0.85"/>

      <!-- Pierre block (brighter, head dots visible) -->
      <rect x="304" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.48)" stroke="rgba(58,90,139,0.4)" stroke-width="1"/>
      <circle cx="312" cy="5" r="1.8" fill="rgba(180,165,140,0.2)"/><circle cx="320" cy="5" r="1.8" fill="rgba(180,165,140,0.2)"/><circle cx="328" cy="5" r="1.8" fill="rgba(180,165,140,0.2)"/>
      <text x="321" y="26" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(200,185,154,0.5)">P</text>

      <!-- YOU — bigger, gold, inner detail -->
      <rect x="342" y="-2" width="40" height="18" rx="3" fill="rgba(58,90,139,0.6)" stroke="rgba(212,168,67,0.5)" stroke-width="2" filter="url(#player-glow)"/>
      <!-- Inner head dots with shako hint -->
      <circle cx="352" cy="5" r="2.2" fill="rgba(200,180,150,0.3)"/><circle cx="362" cy="5" r="2.2" fill="rgba(200,180,150,0.35)"/><circle cx="372" cy="5" r="2.2" fill="rgba(200,180,150,0.3)"/>
      <!-- Musket barrel lines -->
      <line x1="352" y1="-6" x2="352" y2="-1" stroke="rgba(100,85,60,0.3)" stroke-width="0.8"/>
      <line x1="362" y1="-7" x2="362" y2="-1" stroke="rgba(100,85,60,0.3)" stroke-width="0.8"/>
      <line x1="372" y1="-6" x2="372" y2="-1" stroke="rgba(100,85,60,0.3)" stroke-width="0.8"/>
      <text x="362" y="28" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(212,168,67,0.7)" font-weight="bold">YOU</text>

      <!-- JB block -->
      <rect x="386" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.48)" stroke="rgba(58,90,139,0.4)" stroke-width="1"/>
      <circle cx="394" cy="5" r="1.8" fill="rgba(180,165,140,0.2)"/><circle cx="402" cy="5" r="1.8" fill="rgba(180,165,140,0.2)"/><circle cx="410" cy="5" r="1.8" fill="rgba(180,165,140,0.2)"/>
      <text x="403" y="26" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(200,185,154,0.5)">JB</text>

      <!-- Right wing blocks -->
      <rect x="424" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.42)" stroke="rgba(58,90,139,0.32)" stroke-width="0.8" opacity="0.85"/>
      <rect x="462" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.40)" stroke="rgba(58,90,139,0.3)" stroke-width="0.8" opacity="0.8"/>
      <rect x="500" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.38)" stroke="rgba(58,90,139,0.28)" stroke-width="0.8" opacity="0.75"/>
      <rect x="538" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.35)" stroke="rgba(58,90,139,0.26)" stroke-width="0.7" opacity="0.7"/>
      <rect x="576" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.33)" stroke="rgba(58,90,139,0.24)" stroke-width="0.7" opacity="0.65"/>
      <rect x="614" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.30)" stroke="rgba(58,90,139,0.22)" stroke-width="0.7" opacity="0.6"/>
      <rect x="652" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.28)" stroke="rgba(58,90,139,0.2)" stroke-width="0.6" opacity="0.55"/>
      <rect x="690" y="0" width="34" height="14" rx="2" fill="rgba(58,90,139,0.25)" stroke="rgba(58,90,139,0.18)" stroke-width="0.6" opacity="0.5"/>

      <!-- Bayonet line (right side) -->
      <g stroke="rgba(58,90,139,0.15)" stroke-width="0.8">
        <line x1="440" y1="-5" x2="440" y2="0"/><line x1="476" y1="-6" x2="476" y2="0"/>
        <line x1="512" y1="-5" x2="512" y2="0"/><line x1="548" y1="-6" x2="548" y2="0"/>
        <line x1="584" y1="-5" x2="584" y2="0"/><line x1="620" y1="-6" x2="620" y2="0"/>
        <line x1="656" y1="-5" x2="656" y2="0"/><line x1="692" y1="-6" x2="692" y2="0"/>
      </g>

      <!-- Second rank (partial blocks, dimmer) -->
      <g opacity="0.3">
        <rect x="38" y="18" width="34" height="12" rx="2" fill="rgba(58,90,139,0.2)"/>
        <rect x="114" y="18" width="34" height="12" rx="2" fill="rgba(58,90,139,0.2)"/>
        <rect x="190" y="18" width="34" height="12" rx="2" fill="rgba(58,90,139,0.2)"/>
        <rect x="266" y="18" width="34" height="12" rx="2" fill="rgba(58,90,139,0.25)"/>
        <rect x="342" y="20" width="40" height="12" rx="2" fill="rgba(58,90,139,0.25)"/>
        <rect x="424" y="18" width="34" height="12" rx="2" fill="rgba(58,90,139,0.25)"/>
        <rect x="500" y="18" width="34" height="12" rx="2" fill="rgba(58,90,139,0.2)"/>
        <rect x="576" y="18" width="34" height="12" rx="2" fill="rgba(58,90,139,0.2)"/>
        <rect x="652" y="18" width="34" height="12" rx="2" fill="rgba(58,90,139,0.2)"/>
      </g>

      <text x="362" y="46" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(58,90,139,0.25)" letter-spacing="2">14e DEMI-BRIGADE</text>
    </g>
  </svg>
</div>
</body>
</html>
