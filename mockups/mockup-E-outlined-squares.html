<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mockup E: Outlined Squares (Minimal)</title>
<style>
  body { margin: 0; background: #0a0908; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .frame { width: 800px; height: 500px; border-radius: 4px; overflow: hidden; }
  svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="frame">
  <svg viewBox="0 0 800 500">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0a0908"/>
        <stop offset="100%" stop-color="#141210"/>
      </linearGradient>
      <filter id="player-glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="smoke-blur"><feGaussianBlur stdDeviation="8"/></filter>
    </defs>

    <rect width="800" height="500" fill="url(#bg)"/>

    <!-- Austrian column: outline-only squares, no fill, clean geometric -->
    <g transform="translate(340, 35)">
      <!-- Front ranks (brighter outlines) -->
      <g fill="none" stroke="rgba(210,195,165,0.45)" stroke-width="1.2">
        <rect x="0" y="0" width="14" height="14"/><rect x="18" y="0" width="14" height="14"/>
        <rect x="36" y="0" width="14" height="14"/><rect x="54" y="0" width="14" height="14"/>
        <rect x="72" y="0" width="14" height="14"/><rect x="90" y="0" width="14" height="14"/>
        <rect x="108" y="0" width="14" height="14"/>
      </g>
      <g fill="none" stroke="rgba(210,195,165,0.38)" stroke-width="1">
        <rect x="0" y="18" width="14" height="14"/><rect x="18" y="18" width="14" height="14"/>
        <rect x="36" y="18" width="14" height="14"/><rect x="54" y="18" width="14" height="14"/>
        <rect x="72" y="18" width="14" height="14"/><rect x="90" y="18" width="14" height="14"/>
        <rect x="108" y="18" width="14" height="14"/>
      </g>
      <g fill="none" stroke="rgba(210,195,165,0.30)" stroke-width="0.8">
        <rect x="0" y="36" width="14" height="14"/><rect x="18" y="36" width="14" height="14"/>
        <rect x="36" y="36" width="14" height="14"/><rect x="54" y="36" width="14" height="14"/>
        <rect x="72" y="36" width="14" height="14"/><rect x="90" y="36" width="14" height="14"/>
        <rect x="108" y="36" width="14" height="14"/>
      </g>
      <g fill="none" stroke="rgba(210,195,165,0.22)" stroke-width="0.6">
        <rect x="0" y="54" width="14" height="14"/><rect x="18" y="54" width="14" height="14"/>
        <rect x="36" y="54" width="14" height="14"/><rect x="54" y="54" width="14" height="14"/>
        <rect x="72" y="54" width="14" height="14"/><rect x="90" y="54" width="14" height="14"/>
        <rect x="108" y="54" width="14" height="14"/>
      </g>
      <!-- Fading rear -->
      <g fill="none" stroke="rgba(210,195,165,0.14)" stroke-width="0.5">
        <rect x="0" y="72" width="14" height="14"/><rect x="18" y="72" width="14" height="14"/>
        <rect x="36" y="72" width="14" height="14"/><rect x="54" y="72" width="14" height="14"/>
        <rect x="72" y="72" width="14" height="14"/><rect x="90" y="72" width="14" height="14"/>
        <rect x="108" y="72" width="14" height="14"/>
      </g>
      <g fill="none" stroke="rgba(210,195,165,0.08)" stroke-width="0.4">
        <rect x="0" y="90" width="14" height="14"/><rect x="18" y="90" width="14" height="14"/>
        <rect x="36" y="90" width="14" height="14"/><rect x="54" y="90" width="14" height="14"/>
        <rect x="72" y="90" width="14" height="14"/><rect x="90" y="90" width="14" height="14"/>
        <rect x="108" y="90" width="14" height="14"/>
      </g>

      <text x="61" y="-8" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(200,185,154,0.25)" letter-spacing="1.5">AUSTRIAN COL.</text>
    </g>

    <!-- Range -->
    <text x="400" y="225" text-anchor="middle" fill="rgba(200,185,154,0.35)" font-family="'Courier New', monospace" font-size="28" font-weight="600" letter-spacing="3">80</text>
    <text x="400" y="241" text-anchor="middle" fill="rgba(200,185,154,0.18)" font-family="monospace" font-size="8" letter-spacing="4">PACES</text>

    <!-- Smoke -->
    <ellipse cx="400" cy="330" rx="280" ry="12" fill="rgba(120,110,90,0.04)" filter="url(#smoke-blur)"/>

    <!-- French line: outline-only squares, 20 across -->
    <g transform="translate(30, 345)">
      <!-- Front rank -->
      <g fill="none" stroke="rgba(58,90,139,0.3)" stroke-width="0.8">
        <rect x="0" y="0" width="14" height="14" opacity="0.4"/>
        <rect x="36" y="0" width="14" height="14" opacity="0.45"/>
        <rect x="72" y="0" width="14" height="14" opacity="0.5"/>
        <rect x="108" y="0" width="14" height="14" opacity="0.55"/>
        <rect x="144" y="0" width="14" height="14" opacity="0.6"/>
        <rect x="180" y="0" width="14" height="14" opacity="0.65"/>
        <rect x="216" y="0" width="14" height="14" opacity="0.7"/>
        <rect x="252" y="0" width="14" height="14" opacity="0.8"/>
      </g>

      <!-- Pierre — outline with subtle fill -->
      <rect x="288" y="0" width="14" height="14" fill="rgba(58,90,139,0.08)" stroke="rgba(65,100,155,0.5)" stroke-width="1.2"/>
      <text x="295" y="26" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(200,185,154,0.5)">P</text>

      <!-- YOU — gold outline, slightly larger, subtle fill -->
      <rect x="322" y="-2" width="18" height="18" fill="rgba(58,90,139,0.12)" stroke="rgba(212,168,67,0.6)" stroke-width="2" filter="url(#player-glow)"/>
      <!-- Inner cross (like a targeting reticle) -->
      <line x1="331" y1="2" x2="331" y2="12" stroke="rgba(212,168,67,0.2)" stroke-width="0.5"/>
      <line x1="326" y1="7" x2="336" y2="7" stroke="rgba(212,168,67,0.2)" stroke-width="0.5"/>
      <text x="331" y="28" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(212,168,67,0.7)" font-weight="bold">YOU</text>

      <!-- JB — outline with subtle fill -->
      <rect x="360" y="0" width="14" height="14" fill="rgba(58,90,139,0.08)" stroke="rgba(65,100,155,0.5)" stroke-width="1.2"/>
      <text x="367" y="26" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(200,185,154,0.5)">JB</text>

      <g fill="none" stroke="rgba(58,90,139,0.3)" stroke-width="0.8">
        <rect x="396" y="0" width="14" height="14" opacity="0.8"/>
        <rect x="432" y="0" width="14" height="14" opacity="0.7"/>
        <rect x="468" y="0" width="14" height="14" opacity="0.65"/>
        <rect x="504" y="0" width="14" height="14" opacity="0.6"/>
        <rect x="540" y="0" width="14" height="14" opacity="0.55"/>
        <rect x="576" y="0" width="14" height="14" opacity="0.5"/>
        <rect x="612" y="0" width="14" height="14" opacity="0.45"/>
        <rect x="648" y="0" width="14" height="14" opacity="0.4"/>
      </g>

      <!-- Second rank (offset, dimmer outlines) -->
      <g fill="none" stroke="rgba(58,90,139,0.12)" stroke-width="0.5">
        <rect x="18" y="18" width="14" height="14" opacity="0.4"/>
        <rect x="54" y="18" width="14" height="14" opacity="0.45"/>
        <rect x="90" y="18" width="14" height="14" opacity="0.5"/>
        <rect x="126" y="18" width="14" height="14" opacity="0.55"/>
        <rect x="162" y="18" width="14" height="14" opacity="0.6"/>
        <rect x="198" y="18" width="14" height="14" opacity="0.65"/>
        <rect x="234" y="18" width="14" height="14" opacity="0.7"/>
        <rect x="270" y="18" width="14" height="14" opacity="0.8"/>
        <rect x="306" y="18" width="14" height="14" opacity="0.85"/>
        <rect x="340" y="20" width="14" height="14" opacity="0.85"/>
        <rect x="378" y="18" width="14" height="14" opacity="0.8"/>
        <rect x="414" y="18" width="14" height="14" opacity="0.7"/>
        <rect x="450" y="18" width="14" height="14" opacity="0.65"/>
        <rect x="486" y="18" width="14" height="14" opacity="0.6"/>
        <rect x="522" y="18" width="14" height="14" opacity="0.55"/>
        <rect x="558" y="18" width="14" height="14" opacity="0.5"/>
        <rect x="594" y="18" width="14" height="14" opacity="0.45"/>
        <rect x="630" y="18" width="14" height="14" opacity="0.4"/>
      </g>

      <text x="331" y="50" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(58,90,139,0.25)" letter-spacing="2">14e DEMI-BRIGADE</text>
    </g>
  </svg>
</div>
</body>
</html>
