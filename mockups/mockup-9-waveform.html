<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mockup 9: Abstract Waveform</title>
<style>
  body { margin: 0; background: #0a0908; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .frame { width: 800px; height: 500px; position: relative; border-radius: 4px; overflow: hidden; }
  svg { width: 100%; height: 100%; }
  .info { position: absolute; top: 8px; left: 12px; font-family: monospace; font-size: 10px; color: rgba(200,185,154,0.4); letter-spacing: 1px; }
</style>
</head>
<body>
<div class="frame">
  <div class="info">MOCKUP 9 — WAVEFORM: Formations as density waves. Abstract, minimal. Player as a bright point.</div>
  <svg viewBox="0 0 800 500">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#080706"/>
        <stop offset="100%" stop-color="#0c0b09"/>
      </linearGradient>
      <!-- Austrian wave gradient (horizontal band) -->
      <linearGradient id="at-wave" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="transparent"/>
        <stop offset="30%" stop-color="rgba(200,185,154,0.03)"/>
        <stop offset="50%" stop-color="rgba(200,185,154,0.12)"/>
        <stop offset="70%" stop-color="rgba(200,185,154,0.03)"/>
        <stop offset="100%" stop-color="transparent"/>
      </linearGradient>
      <!-- French wave gradient -->
      <linearGradient id="fr-wave" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="transparent"/>
        <stop offset="30%" stop-color="rgba(58,90,139,0.03)"/>
        <stop offset="50%" stop-color="rgba(58,90,139,0.15)"/>
        <stop offset="70%" stop-color="rgba(58,90,139,0.03)"/>
        <stop offset="100%" stop-color="transparent"/>
      </linearGradient>
      <!-- Player glow -->
      <radialGradient id="player-glow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="rgba(212,168,67,0.4)"/>
        <stop offset="40%" stop-color="rgba(212,168,67,0.1)"/>
        <stop offset="100%" stop-color="transparent"/>
      </radialGradient>
    </defs>

    <rect width="800" height="500" fill="url(#bg)"/>

    <!-- === AUSTRIAN DENSITY WAVE === -->
    <!-- Deep column = tall narrow wave -->
    <g>
      <!-- Wave body -->
      <rect x="310" y="40" width="180" height="160" fill="url(#at-wave)"/>

      <!-- Density particles (individual dots representing men) -->
      <!-- Front of column (dense, bright) -->
      <g fill="rgba(200,185,154,0.45)">
        <circle cx="360" cy="140" r="1.5"/><circle cx="370" cy="138" r="1.5"/>
        <circle cx="380" cy="141" r="1.5"/><circle cx="390" cy="139" r="1.5"/>
        <circle cx="400" cy="140" r="1.5"/><circle cx="410" cy="138" r="1.5"/>
        <circle cx="420" cy="141" r="1.5"/><circle cx="430" cy="139" r="1.5"/>
        <circle cx="365" cy="130" r="1.3"/><circle cx="375" cy="128" r="1.3"/>
        <circle cx="385" cy="131" r="1.3"/><circle cx="395" cy="129" r="1.3"/>
        <circle cx="405" cy="130" r="1.3"/><circle cx="415" cy="128" r="1.3"/>
        <circle cx="425" cy="131" r="1.3"/>
      </g>
      <!-- Middle (medium density) -->
      <g fill="rgba(200,185,154,0.30)">
        <circle cx="362" cy="115" r="1.2"/><circle cx="378" cy="113" r="1.2"/>
        <circle cx="392" cy="116" r="1.2"/><circle cx="408" cy="114" r="1.2"/>
        <circle cx="422" cy="115" r="1.2"/>
        <circle cx="368" cy="105" r="1.2"/><circle cx="385" cy="103" r="1.2"/>
        <circle cx="402" cy="106" r="1.2"/><circle cx="418" cy="104" r="1.2"/>
      </g>
      <!-- Rear (sparse, faded) -->
      <g fill="rgba(200,185,154,0.15)">
        <circle cx="370" cy="90" r="1"/><circle cx="390" cy="88" r="1"/>
        <circle cx="410" cy="91" r="1"/>
        <circle cx="375" cy="75" r="0.8"/><circle cx="400" cy="73" r="0.8"/>
        <circle cx="380" cy="60" r="0.6"/><circle cx="405" cy="58" r="0.6"/>
      </g>

      <!-- Formation edge (thin vertical lines) -->
      <line x1="350" y1="60" x2="350" y2="150" stroke="rgba(200,185,154,0.1)" stroke-width="0.5"/>
      <line x1="440" y1="60" x2="440" y2="150" stroke="rgba(200,185,154,0.1)" stroke-width="0.5"/>

      <text x="395" y="42" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(200,185,154,0.2)" letter-spacing="1.5">AUSTRIAN COL.</text>
    </g>

    <!-- === RANGE ZONE === -->
    <!-- Empty void between waves, range as a pulse line -->
    <line x1="100" y1="260" x2="700" y2="260" stroke="rgba(200,185,154,0.04)" stroke-width="0.5"/>
    <text x="400" y="256" text-anchor="middle" fill="rgba(200,185,154,0.3)" font-family="'Courier New', monospace" font-size="28" font-weight="300" letter-spacing="8">80</text>
    <text x="400" y="274" text-anchor="middle" fill="rgba(200,185,154,0.12)" font-family="monospace" font-size="8" letter-spacing="5">PACES</text>

    <!-- Thin dashes showing fire exchange zone -->
    <g stroke="rgba(200,185,154,0.06)" stroke-width="0.3" stroke-dasharray="3,6">
      <line x1="200" y1="200" x2="200" y2="320"/>
      <line x1="300" y1="190" x2="300" y2="330"/>
      <line x1="400" y1="185" x2="400" y2="335"/>
      <line x1="500" y1="190" x2="500" y2="330"/>
      <line x1="600" y1="200" x2="600" y2="320"/>
    </g>

    <!-- === FRENCH DENSITY WAVE === -->
    <!-- Line formation = wide thin wave -->
    <g>
      <rect x="40" y="340" width="720" height="60" fill="url(#fr-wave)"/>

      <!-- Density particles (the line) -->
      <!-- Left wing (sparser, dimmer) -->
      <g fill="rgba(58,90,139,0.3)">
        <circle cx="60" cy="370" r="1.2"/><circle cx="80" cy="368" r="1.2"/>
        <circle cx="100" cy="371" r="1.2"/><circle cx="120" cy="369" r="1.2"/>
        <circle cx="140" cy="370" r="1.2"/><circle cx="160" cy="368" r="1.2"/>
        <circle cx="180" cy="371" r="1.2"/><circle cx="200" cy="369" r="1.2"/>
        <circle cx="220" cy="370" r="1.2"/><circle cx="240" cy="368" r="1.2"/>
        <circle cx="260" cy="370" r="1.2"/><circle cx="280" cy="369" r="1.2"/>
      </g>
      <!-- Second rank -->
      <g fill="rgba(58,90,139,0.2)">
        <circle cx="70" cy="380" r="1"/><circle cx="110" cy="378" r="1"/>
        <circle cx="150" cy="381" r="1"/><circle cx="190" cy="379" r="1"/>
        <circle cx="230" cy="380" r="1"/><circle cx="270" cy="378" r="1"/>
      </g>

      <!-- === PLAYER ZONE (brighter, denser, with individuals) === -->
      <!-- Player zone particles (front rank) -->
      <g fill="rgba(58,90,139,0.5)">
        <circle cx="320" cy="370" r="1.5"/>
        <circle cx="340" cy="368" r="1.5"/>
      </g>
      <!-- Pierre -->
      <circle cx="360" cy="370" r="2" fill="rgba(80,110,160,0.6)" stroke="rgba(80,110,160,0.3)" stroke-width="0.5"/>
      <text x="360" y="362" text-anchor="middle" font-family="monospace" font-size="6" fill="rgba(200,185,154,0.4)">P</text>

      <!-- YOU — bright beacon -->
      <circle cx="400" cy="370" r="8" fill="url(#player-glow)"/>
      <circle cx="400" cy="370" r="3" fill="rgba(212,168,67,0.6)" stroke="rgba(212,168,67,0.4)" stroke-width="1"/>
      <text x="400" y="362" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(212,168,67,0.7)" font-weight="bold">YOU</text>

      <!-- JB -->
      <circle cx="440" cy="370" r="2" fill="rgba(80,110,160,0.6)" stroke="rgba(80,110,160,0.3)" stroke-width="0.5"/>
      <text x="440" y="362" text-anchor="middle" font-family="monospace" font-size="6" fill="rgba(200,185,154,0.4)">JB</text>

      <g fill="rgba(58,90,139,0.5)">
        <circle cx="460" cy="368" r="1.5"/>
        <circle cx="480" cy="370" r="1.5"/>
      </g>

      <!-- Right wing -->
      <g fill="rgba(58,90,139,0.3)">
        <circle cx="520" cy="370" r="1.2"/><circle cx="540" cy="368" r="1.2"/>
        <circle cx="560" cy="371" r="1.2"/><circle cx="580" cy="369" r="1.2"/>
        <circle cx="600" cy="370" r="1.2"/><circle cx="620" cy="368" r="1.2"/>
        <circle cx="640" cy="371" r="1.2"/><circle cx="660" cy="369" r="1.2"/>
        <circle cx="680" cy="370" r="1.2"/><circle cx="700" cy="368" r="1.2"/>
        <circle cx="720" cy="370" r="1.2"/><circle cx="740" cy="369" r="1.2"/>
      </g>
      <g fill="rgba(58,90,139,0.2)">
        <circle cx="530" cy="380" r="1"/><circle cx="570" cy="378" r="1"/>
        <circle cx="610" cy="381" r="1"/><circle cx="650" cy="379" r="1"/>
        <circle cx="690" cy="380" r="1"/><circle cx="730" cy="378" r="1"/>
      </g>

      <!-- Formation edges -->
      <line x1="50" y1="360" x2="50" y2="380" stroke="rgba(58,90,139,0.1)" stroke-width="0.5"/>
      <line x1="750" y1="360" x2="750" y2="380" stroke="rgba(58,90,139,0.1)" stroke-width="0.5"/>

      <text x="400" y="400" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(58,90,139,0.2)" letter-spacing="2">14e DEMI-BRIGADE</text>
    </g>

    <!-- === VOLLEY TRACES (thin arcs showing recent fire) === -->
    <!-- French volley arcs going up -->
    <g stroke="rgba(212,168,67,0.08)" stroke-width="0.5" fill="none">
      <path d="M 100 365 Q 200 280 360 155"/>
      <path d="M 300 365 Q 350 290 390 155"/>
      <path d="M 400 365 Q 400 290 400 155"/>
      <path d="M 500 365 Q 430 290 410 155"/>
      <path d="M 700 365 Q 550 280 430 155"/>
    </g>

    <!-- === HEARTBEAT LINE (player vitals as waveform at very bottom) === -->
    <g transform="translate(0, 460)">
      <line x1="0" y1="0" x2="800" y2="0" stroke="rgba(200,185,154,0.05)" stroke-width="0.5"/>
      <!-- Pulse representing morale/health -->
      <polyline
        points="0,0 100,0 120,-5 130,8 140,-12 150,5 160,-3 170,0 400,0 420,-4 430,6 440,-10 450,4 460,-2 470,0 800,0"
        fill="none" stroke="rgba(58,90,139,0.15)" stroke-width="1"/>
    </g>
  </svg>
</div>
</body>
</html>
