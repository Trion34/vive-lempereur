<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mockup 1: Clean Tactical</title>
<style>
  body { margin: 0; background: #0a0908; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .frame { width: 800px; height: 520px; position: relative; border-radius: 6px; overflow: hidden; }
  svg { width: 100%; height: 100%; }
  .caption-overlay {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 28px 20px;
    background: linear-gradient(to bottom, transparent 0%, rgba(10,9,8,0.85) 25%, rgba(10,9,8,0.95) 100%);
    font-family: 'Georgia', serif; color: #c8b99a;
  }
  .caption-overlay .order { color: #d4a843; font-weight: 600; font-size: 15px; margin-bottom: 6px; border-left: 2px solid #d4a843; padding-left: 10px; }
  .caption-overlay .narrative { font-size: 14px; line-height: 1.5; margin-bottom: 5px; opacity: 0.9; }
  .caption-overlay .event { color: #c85a3a; font-size: 14px; margin-bottom: 5px; border-left: 2px solid #8b3a2a; padding-left: 10px; }
  .label { font-family: monospace; font-size: 9px; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="frame">
  <svg viewBox="0 0 800 500">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0a0908"/>
        <stop offset="100%" stop-color="#141210"/>
      </linearGradient>
      <!-- Subtle grid lines for tactical feel -->
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(200,185,154,0.04)" stroke-width="0.5"/>
      </pattern>
    </defs>

    <!-- Background -->
    <rect width="800" height="500" fill="url(#bg)"/>
    <rect width="800" height="500" fill="url(#grid)"/>

    <!-- Austrian column — 4x6 packed block -->
    <g transform="translate(356, 80)">
      <!-- Column shadow -->
      <rect x="-4" y="-4" width="96" height="124" rx="2" fill="rgba(200,185,154,0.05)"/>
      <g>
        <!-- 4 cols x 6 rows -->
        <rect x="0" y="0" width="18" height="18" rx="1" fill="rgba(200,185,154,0.55)" stroke="rgba(200,185,154,0.7)" stroke-width="0.5"/>
        <rect x="22" y="0" width="18" height="18" rx="1" fill="rgba(200,185,154,0.55)" stroke="rgba(200,185,154,0.7)" stroke-width="0.5"/>
        <rect x="44" y="0" width="18" height="18" rx="1" fill="rgba(200,185,154,0.55)" stroke="rgba(200,185,154,0.7)" stroke-width="0.5"/>
        <rect x="66" y="0" width="18" height="18" rx="1" fill="rgba(200,185,154,0.55)" stroke="rgba(200,185,154,0.7)" stroke-width="0.5"/>

        <rect x="0" y="22" width="18" height="18" rx="1" fill="rgba(200,185,154,0.55)" stroke="rgba(200,185,154,0.7)" stroke-width="0.5"/>
        <rect x="22" y="22" width="18" height="18" rx="1" fill="rgba(200,185,154,0.55)" stroke="rgba(200,185,154,0.7)" stroke-width="0.5"/>
        <rect x="44" y="22" width="18" height="18" rx="1" fill="rgba(200,185,154,0.55)" stroke="rgba(200,185,154,0.7)" stroke-width="0.5"/>
        <rect x="66" y="22" width="18" height="18" rx="1" fill="rgba(200,185,154,0.55)" stroke="rgba(200,185,154,0.7)" stroke-width="0.5"/>

        <rect x="0" y="44" width="18" height="18" rx="1" fill="rgba(200,185,154,0.55)" stroke="rgba(200,185,154,0.7)" stroke-width="0.5"/>
        <rect x="22" y="44" width="18" height="18" rx="1" fill="rgba(200,185,154,0.55)" stroke="rgba(200,185,154,0.7)" stroke-width="0.5"/>
        <rect x="44" y="44" width="18" height="18" rx="1" fill="rgba(200,185,154,0.55)" stroke="rgba(200,185,154,0.7)" stroke-width="0.5"/>
        <rect x="66" y="44" width="18" height="18" rx="1" fill="rgba(200,185,154,0.55)" stroke="rgba(200,185,154,0.7)" stroke-width="0.5"/>

        <rect x="0" y="66" width="18" height="18" rx="1" fill="rgba(200,185,154,0.50)" stroke="rgba(200,185,154,0.6)" stroke-width="0.5"/>
        <rect x="22" y="66" width="18" height="18" rx="1" fill="rgba(200,185,154,0.50)" stroke="rgba(200,185,154,0.6)" stroke-width="0.5"/>
        <rect x="44" y="66" width="18" height="18" rx="1" fill="rgba(200,185,154,0.50)" stroke="rgba(200,185,154,0.6)" stroke-width="0.5"/>
        <rect x="66" y="66" width="18" height="18" rx="1" fill="rgba(200,185,154,0.50)" stroke="rgba(200,185,154,0.6)" stroke-width="0.5"/>

        <rect x="0" y="88" width="18" height="18" rx="1" fill="rgba(200,185,154,0.40)" stroke="rgba(200,185,154,0.5)" stroke-width="0.5"/>
        <rect x="22" y="88" width="18" height="18" rx="1" fill="rgba(200,185,154,0.40)" stroke="rgba(200,185,154,0.5)" stroke-width="0.5"/>
        <rect x="44" y="88" width="18" height="18" rx="1" fill="rgba(200,185,154,0.40)" stroke="rgba(200,185,154,0.5)" stroke-width="0.5"/>
        <rect x="66" y="88" width="18" height="18" rx="1" fill="rgba(200,185,154,0.40)" stroke="rgba(200,185,154,0.5)" stroke-width="0.5"/>
      </g>
      <text x="42" y="-10" text-anchor="middle" fill="rgba(200,185,154,0.4)" font-family="monospace" font-size="8" letter-spacing="2">AUSTRIAN COLUMN</text>
    </g>

    <!-- Range display -->
    <text x="400" y="270" text-anchor="middle" fill="rgba(200,185,154,0.5)" font-family="'Courier New', monospace" font-size="32" font-weight="600" letter-spacing="3">80</text>
    <text x="400" y="288" text-anchor="middle" fill="rgba(200,185,154,0.3)" font-family="monospace" font-size="9" letter-spacing="4">PACES</text>

    <!-- Thin horizontal range markers -->
    <line x1="340" y1="260" x2="350" y2="260" stroke="rgba(200,185,154,0.15)" stroke-width="0.5"/>
    <line x1="450" y1="260" x2="460" y2="260" stroke="rgba(200,185,154,0.15)" stroke-width="0.5"/>

    <!-- French line — 20 tokens in a row -->
    <g transform="translate(80, 370)">
      <rect x="0" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="33" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="66" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="99" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="132" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="165" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="198" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="231" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="264" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.6)" stroke="rgba(58,90,139,0.8)" stroke-width="0.8"/>
      <!-- Pierre -->
      <rect x="297" y="0" width="30" height="12" rx="2" fill="rgba(70,100,150,0.7)" stroke="rgba(58,90,139,0.8)" stroke-width="0.8"/>
      <text x="312" y="24" text-anchor="middle" fill="rgba(200,185,154,0.5)" font-family="monospace" font-size="7" letter-spacing="1">P</text>
      <!-- Player -->
      <rect x="330" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.85)" stroke="#d4a843" stroke-width="2"/>
      <text x="345" y="24" text-anchor="middle" fill="#d4a843" font-family="monospace" font-size="7" font-weight="bold" letter-spacing="1">YOU</text>
      <!-- JB -->
      <rect x="363" y="0" width="30" height="12" rx="2" fill="rgba(70,100,150,0.7)" stroke="rgba(58,90,139,0.8)" stroke-width="0.8"/>
      <text x="378" y="24" text-anchor="middle" fill="rgba(200,185,154,0.5)" font-family="monospace" font-size="7" letter-spacing="1">JB</text>

      <rect x="396" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="429" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="462" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="495" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="528" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="561" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>
      <rect x="594" y="0" width="30" height="12" rx="2" fill="rgba(58,90,139,0.5)" stroke="rgba(58,90,139,0.7)" stroke-width="0.8"/>

      <text x="312" y="-8" text-anchor="middle" fill="rgba(58,90,139,0.35)" font-family="monospace" font-size="8" letter-spacing="2">14e DEMI-BRIGADE</text>
    </g>
  </svg>

  <!-- Caption overlay -->
  <div class="caption-overlay">
    <div class="order">"FIRE!" At eighty paces, the captain's voice is raw.</div>
    <div class="narrative">The volley tears into the Austrian column. Men crumple in the front ranks.</div>
    <div class="event">A ball strikes the ground at your feet. Dirt sprays your face.</div>
  </div>
</div>
</body>
</html>
