<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mockup 12: First-Person Perspective</title>
<style>
  body { margin: 0; background: #0a0908; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .frame { width: 800px; height: 500px; position: relative; border-radius: 4px; overflow: hidden; }
  svg { width: 100%; height: 100%; }
  .info { position: absolute; top: 8px; left: 12px; font-family: monospace; font-size: 10px; color: rgba(200,185,154,0.4); letter-spacing: 1px; }
</style>
</head>
<body>
<div class="frame">
  <div class="info">MOCKUP 12 — FIRST-PERSON PERSPECTIVE: Looking forward from YOUR position in the line.</div>
  <svg viewBox="0 0 800 500">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0d0b08"/>
        <stop offset="40%" stop-color="#12100d"/>
        <stop offset="60%" stop-color="#161310"/>
        <stop offset="100%" stop-color="#1a1714"/>
      </linearGradient>
      <!-- Smoke haze -->
      <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="transparent"/>
        <stop offset="50%" stop-color="rgba(120,110,90,0.06)"/>
        <stop offset="100%" stop-color="transparent"/>
      </linearGradient>
      <filter id="distant-blur">
        <feGaussianBlur stdDeviation="1.5"/>
      </filter>
    </defs>

    <!-- Sky -->
    <rect width="800" height="500" fill="url(#sky)"/>

    <!-- Horizon line -->
    <line x1="0" y1="200" x2="800" y2="200" stroke="rgba(100,85,60,0.08)" stroke-width="1"/>

    <!-- Distant hills on horizon -->
    <path d="M 0 200 Q 150 185 300 195 Q 450 180 600 190 Q 700 185 800 200" fill="rgba(30,25,18,0.3)" stroke="none"/>

    <!-- Ground perspective (receding toward horizon) -->
    <polygon points="0,500 800,500 800,200 0,200" fill="rgba(50,42,28,0.08)"/>

    <!-- Perspective lines converging to vanishing point -->
    <g stroke="rgba(80,65,40,0.04)" stroke-width="0.5">
      <line x1="0" y1="500" x2="400" y2="200"/>
      <line x1="200" y1="500" x2="400" y2="200"/>
      <line x1="400" y1="500" x2="400" y2="200"/>
      <line x1="600" y1="500" x2="400" y2="200"/>
      <line x1="800" y1="500" x2="400" y2="200"/>
    </g>

    <!-- === AUSTRIAN COLUMN (approaching in the distance) === -->
    <g filter="url(#distant-blur)">
      <!-- Mass of white-coated troops on the horizon -->
      <rect x="350" y="205" width="100" height="45" rx="2" fill="rgba(200,185,154,0.12)" stroke="rgba(200,185,154,0.08)" stroke-width="1"/>

      <!-- Suggestion of ranks/files inside -->
      <g stroke="rgba(200,185,154,0.06)" stroke-width="0.5">
        <line x1="355" y1="215" x2="445" y2="215"/>
        <line x1="355" y1="225" x2="445" y2="225"/>
        <line x1="355" y1="235" x2="445" y2="235"/>
      </g>

      <!-- Bayonet tips (tiny, glinting) -->
      <g fill="rgba(200,185,154,0.2)">
        <circle cx="365" cy="203" r="0.8"/>
        <circle cx="375" cy="202" r="0.8"/>
        <circle cx="385" cy="203" r="0.8"/>
        <circle cx="395" cy="202" r="0.8"/>
        <circle cx="405" cy="203" r="0.8"/>
        <circle cx="415" cy="202" r="0.8"/>
        <circle cx="425" cy="203" r="0.8"/>
        <circle cx="435" cy="202" r="0.8"/>
      </g>

      <!-- Regimental flag -->
      <line x1="400" y1="195" x2="400" y2="205" stroke="rgba(200,185,154,0.15)" stroke-width="1"/>
      <rect x="401" y="195" width="8" height="5" rx="0.5" fill="rgba(200,185,154,0.1)" stroke="rgba(200,185,154,0.12)" stroke-width="0.5"/>
    </g>

    <!-- Range label (centered, overlaid on the gap) -->
    <rect x="355" y="255" width="90" height="26" rx="3" fill="rgba(10,9,8,0.6)" stroke="rgba(200,185,154,0.15)" stroke-width="0.5"/>
    <text x="400" y="272" text-anchor="middle" fill="rgba(200,185,154,0.4)" font-family="'Courier New', monospace" font-size="14" font-weight="600" letter-spacing="2">80 PACES</text>

    <!-- Smoke haze between formations -->
    <rect x="0" y="240" width="800" height="60" fill="url(#haze)"/>

    <!-- === FRENCH LINE (seen from behind/among — first-person view) === -->

    <!-- Far-left comrade (seen from behind, very foreshortened) -->
    <g transform="translate(30, 280)" opacity="0.3">
      <rect x="0" y="20" width="18" height="80" rx="2" fill="rgba(58,90,139,0.4)"/>
      <rect x="2" y="8" width="14" height="14" rx="2" fill="rgba(58,90,139,0.35)"/>
      <rect x="4" y="0" width="10" height="10" rx="1" fill="rgba(58,90,139,0.3)"/>
      <line x1="18" y1="12" x2="20" y2="90" stroke="rgba(100,85,60,0.3)" stroke-width="2"/>
    </g>

    <!-- Mid-left comrades -->
    <g transform="translate(90, 270)" opacity="0.4">
      <rect x="0" y="25" width="22" height="90" rx="2" fill="rgba(58,90,139,0.45)"/>
      <rect x="2" y="10" width="18" height="18" rx="2" fill="rgba(58,90,139,0.4)"/>
      <rect x="4" y="0" width="14" height="12" rx="1" fill="rgba(58,90,139,0.35)"/>
      <line x1="22" y1="14" x2="25" y2="100" stroke="rgba(100,85,60,0.3)" stroke-width="2.5"/>
    </g>

    <g transform="translate(150, 260)" opacity="0.5">
      <rect x="0" y="30" width="26" height="100" rx="2" fill="rgba(58,90,139,0.5)"/>
      <rect x="2" y="12" width="22" height="20" rx="2" fill="rgba(58,90,139,0.45)"/>
      <rect x="4" y="0" width="18" height="14" rx="1" fill="rgba(58,90,139,0.4)"/>
      <!-- Cross belts visible from behind -->
      <line x1="4" y1="32" x2="24" y2="80" stroke="rgba(220,210,190,0.15)" stroke-width="1"/>
      <line x1="24" y1="32" x2="4" y2="80" stroke="rgba(220,210,190,0.15)" stroke-width="1"/>
      <line x1="26" y1="16" x2="30" y2="120" stroke="rgba(100,85,60,0.35)" stroke-width="3"/>
    </g>

    <!-- === PIERRE (left neighbor, close, seen at angle) === -->
    <g transform="translate(220, 240)" opacity="0.8">
      <!-- Shako -->
      <rect x="4" y="0" width="24" height="16" rx="2" fill="rgba(58,90,139,0.65)"/>
      <rect x="8" y="-6" width="16" height="8" rx="1" fill="rgba(58,90,139,0.55)"/>
      <!-- Head (profile, looking forward) -->
      <ellipse cx="16" cy="22" rx="10" ry="8" fill="rgba(200,180,150,0.35)"/>
      <!-- Body -->
      <rect x="0" y="28" width="32" height="40" rx="2" fill="rgba(58,90,139,0.6)"/>
      <!-- Cross belts -->
      <line x1="4" y1="30" x2="28" y2="62" stroke="rgba(220,210,190,0.25)" stroke-width="1.5"/>
      <line x1="28" y1="30" x2="4" y2="62" stroke="rgba(220,210,190,0.25)" stroke-width="1.5"/>
      <!-- Cartridge box -->
      <rect x="28" y="48" width="10" height="8" rx="1" fill="rgba(60,50,35,0.4)"/>
      <!-- Legs -->
      <rect x="2" y="68" width="12" height="28" rx="2" fill="rgba(200,185,154,0.3)"/>
      <rect x="18" y="68" width="12" height="28" rx="2" fill="rgba(200,185,154,0.3)"/>
      <!-- Musket (presented forward) -->
      <line x1="32" y1="30" x2="50" y2="20" stroke="rgba(100,85,60,0.5)" stroke-width="3"/>
      <line x1="50" y1="20" x2="56" y2="18" stroke="rgba(180,170,160,0.35)" stroke-width="1.5"/>
      <text x="16" y="108" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(200,185,154,0.5)">PIERRE</text>
    </g>

    <!-- === YOUR MUSKET (first-person, extending from bottom-center forward) === -->
    <g>
      <!-- Musket stock (at bottom, your hands) -->
      <rect x="370" y="460" width="60" height="40" rx="3" fill="rgba(80,60,30,0.3)" stroke="rgba(100,85,60,0.2)" stroke-width="1"/>
      <!-- Barrel going forward/up toward horizon -->
      <line x1="400" y1="460" x2="398" y2="300" stroke="rgba(80,65,40,0.4)" stroke-width="4"/>
      <line x1="400" y1="460" x2="398" y2="300" stroke="rgba(100,85,60,0.3)" stroke-width="2"/>
      <!-- Bayonet at tip -->
      <line x1="398" y1="300" x2="397" y2="280" stroke="rgba(180,170,160,0.3)" stroke-width="2"/>
      <!-- Lock mechanism -->
      <rect x="405" y="420" width="12" height="8" rx="1" fill="rgba(120,110,90,0.2)" stroke="rgba(120,110,90,0.15)" stroke-width="0.5"/>
      <!-- Hands suggestion -->
      <ellipse cx="395" cy="440" rx="12" ry="6" fill="rgba(200,180,150,0.15)"/>
      <ellipse cx="395" cy="400" rx="10" ry="5" fill="rgba(200,180,150,0.12)"/>
    </g>

    <!-- === JB (right neighbor, close, seen at angle) === -->
    <g transform="translate(520, 240)" opacity="0.8">
      <rect x="4" y="0" width="24" height="16" rx="2" fill="rgba(58,90,139,0.65)"/>
      <rect x="8" y="-6" width="16" height="8" rx="1" fill="rgba(58,90,139,0.55)"/>
      <ellipse cx="16" cy="22" rx="10" ry="8" fill="rgba(200,180,150,0.35)"/>
      <rect x="0" y="28" width="32" height="40" rx="2" fill="rgba(58,90,139,0.6)"/>
      <line x1="4" y1="30" x2="28" y2="62" stroke="rgba(220,210,190,0.25)" stroke-width="1.5"/>
      <line x1="28" y1="30" x2="4" y2="62" stroke="rgba(220,210,190,0.25)" stroke-width="1.5"/>
      <rect x="2" y="68" width="12" height="28" rx="2" fill="rgba(200,185,154,0.3)"/>
      <rect x="18" y="68" width="12" height="28" rx="2" fill="rgba(200,185,154,0.3)"/>
      <line x1="0" y1="30" x2="-18" y2="20" stroke="rgba(100,85,60,0.5)" stroke-width="3"/>
      <line x1="-18" y1="20" x2="-24" y2="18" stroke="rgba(180,170,160,0.35)" stroke-width="1.5"/>
      <text x="16" y="108" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(200,185,154,0.5)">J-BAPTISTE</text>
    </g>

    <!-- Far-right comrades -->
    <g transform="translate(610, 260)" opacity="0.5">
      <rect x="0" y="30" width="26" height="100" rx="2" fill="rgba(58,90,139,0.5)"/>
      <rect x="2" y="12" width="22" height="20" rx="2" fill="rgba(58,90,139,0.45)"/>
      <rect x="4" y="0" width="18" height="14" rx="1" fill="rgba(58,90,139,0.4)"/>
      <line x1="0" y1="16" x2="-4" y2="120" stroke="rgba(100,85,60,0.35)" stroke-width="3"/>
    </g>

    <g transform="translate(680, 270)" opacity="0.4">
      <rect x="0" y="25" width="22" height="90" rx="2" fill="rgba(58,90,139,0.45)"/>
      <rect x="2" y="10" width="18" height="18" rx="2" fill="rgba(58,90,139,0.4)"/>
      <rect x="4" y="0" width="14" height="12" rx="1" fill="rgba(58,90,139,0.35)"/>
    </g>

    <g transform="translate(740, 280)" opacity="0.3">
      <rect x="0" y="20" width="18" height="80" rx="2" fill="rgba(58,90,139,0.4)"/>
      <rect x="2" y="8" width="14" height="14" rx="2" fill="rgba(58,90,139,0.35)"/>
    </g>
  </svg>
</div>
</body>
</html>
